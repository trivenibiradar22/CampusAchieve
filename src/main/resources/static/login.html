
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Achieve</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f5ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #172554;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 42px;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(39,60,155,0.09);
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            color: #273c9b;
            text-decoration: none;
        }

        .brand span {
            color: #7956e8;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
            font-size: 13px;
        }

        .form-control {
            padding: 13px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #7154df;
            box-shadow: 0 0 0 3px rgba(113,84,223,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #273c9b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 12px;
        }

        .btn-login:hover {
            background: #7154df;
        }

        .register-link {
            color: #7154df;
            font-weight: 700;
            text-decoration: none;
        }

        #message {
            font-size: 14px;
            margin-top: 15px;
        }

        @media(max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">

        <a href="/" class="brand">
            Campus<span>Achieve.</span>
        </a>

        <h3 class="fw-bold mt-4">Welcome Back!</h3>

        <p class="subtitle">
            Login to manage your achievements.
        </p>

    </div>

    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label">Email Address</label>

            <input type="email"
                   class="form-control"
                   id="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>

            <input type="password"
                   class="form-control"
                   id="password"
                   placeholder="Enter your password"
                   required>
        </div>

        <button type="submit"
                class="btn-login"
                id="loginButton">

            Login to Account

        </button>

        <div id="message"
             class="text-center"
             role="alert">
        </div>

    </form>

    <p class="text-center mt-4 mb-0 subtitle">

        Don't have an account?

        <a href="/register.html" class="register-link">
            Create Account
        </a>

    </p>

    <p class="text-center mt-3 mb-0">
        <a href="/" class="subtitle text-decoration-none">
            ← Back to Home
        </a>
    </p>

</div>

<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        button.disabled = true;
        button.textContent = "Logging in...";
        message.textContent = "";

        try {

            const response = await fetch("/api/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.message ||
                    result.error ||
                    "Invalid email or password."
                );
            }

            if (!result.token) {
                throw new Error(
                    "Login response does not contain a token."
                );
            }

            // Save login information

            localStorage.setItem("token", result.token);
            localStorage.setItem("userId", result.userId);
            localStorage.setItem("name", result.name);
            localStorage.setItem("email", result.email);
            localStorage.setItem("role", result.role);

            // Get user role

            const role = String(result.role || "")
                .replace("ROLE_", "")
                .toUpperCase();

            message.style.color = "green";
            message.textContent = "Login successful! Redirecting...";

            // Role-based dashboard redirection

            if (role === "FACULTY") {

                setTimeout(() => {
                    window.location.href = "/faculty-dashboard.html";
                }, 500);

            }

            else if (role === "STUDENT") {

                setTimeout(() => {
                    window.location.href = "/dashboard.html";
                }, 500);

            }

            else if (role === "ADMIN") {

                setTimeout(() => {
                    window.location.href = "/admin-dashboard.html";
                }, 500);

            }

            else {

                throw new Error(
                    "Unknown user role: " + role
                );

            }

        }

        catch (error) {

            message.style.color = "red";
            message.textContent = error.message;

            button.disabled = false;
            button.textContent = "Login to Account";

        }

    }
);

</script>

</body>
</html>
