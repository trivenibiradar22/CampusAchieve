
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Campus Achieve</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f5ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #172554;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(39, 60, 155, 0.09);
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            color: #273c9b;
            text-decoration: none;
        }

        .brand span { color: #7956e8; }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
            font-size: 13px;
        }

        .form-control {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #7154df;
            box-shadow: 0 0 0 3px rgba(113,84,223,0.1);
        }

        .btn-primary-custom {
            width: 100%;
            padding: 13px;
            background: #273c9b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 12px;
        }

        .btn-primary-custom:hover {
            background: #7154df;
        }

        .login-link {
            color: #7154df;
            font-weight: 700;
            text-decoration: none;
        }

        #message {
            font-size: 14px;
            margin-top: 15px;
        }

        @media(max-width: 480px) {
            .register-card { padding: 25px 20px; }
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">
        <a href="/" class="brand">Campus<span>Achieve.</span></a>
        <h3 class="fw-bold mt-4">Create Your Account</h3>
        <p class="subtitle">Start building your digital achievement portfolio.</p>
    </div>

    <form id="registerForm">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name"
                   placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email"
                   placeholder="Enter your college email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" class="form-control" id="department"
                   placeholder="Example: ENTC, Computer, IT" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password"
                   placeholder="Create a password" minlength="8" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword"
                   placeholder="Confirm your password" minlength="8" required>
        </div>

        <button type="submit" class="btn-primary-custom" id="registerButton">
            Create Account
        </button>

        <div id="message" class="text-center" role="alert"></div>

    </form>

    <p class="text-center mt-4 mb-0 subtitle">
        Already have an account?
        <a href="/login.html" class="login-link">Login</a>
    </p>

    <p class="text-center mt-3 mb-0">
        <a href="/" class="subtitle text-decoration-none">← Back to Home</a>
    </p>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit",
    async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const department = document.getElementById("department").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        message.textContent = "";

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match.";
            return;
        }

        button.disabled = true;
        button.textContent = "Creating Account...";

        try {
            const response = await fetch("/api/users/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    department: department,
                    password: password
                })
            });

            const result = await response.json().catch(() => ({}));

            if (response.ok) {
                message.style.color = "green";
                message.textContent = "Registration successful! Please login.";

                document.getElementById("registerForm").reset();

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1500);

            } else {
                message.style.color = "red";
                message.textContent =
                    result.message || result.error || "Registration failed. Please check your details.";
            }

        } catch (error) {
            message.style.color = "red";
            message.textContent = "Unable to connect to server. Please try again.";
        } finally {
            button.disabled = false;
            button.textContent = "Create Account";
        }
    });
</script>

</body>
</html>
